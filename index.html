<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bateras Beat · 3 landing pages (rascunho local)</title>
<meta name="description" content="Rascunho local das três landing pages da Bateras Beat: adultos, pais e banda.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap">
<link rel="stylesheet" href="comum/base.css">
<style>
  :root { --fonte-texto: "Inter", system-ui, sans-serif; --fonte-display: "Inter", system-ui, sans-serif; }
  main { min-height: 100svh; display: grid; place-items: center; padding: 40px 16px; }
  .caixa { width: min(100%, 720px); }
  h1 { font-weight: 800; font-size: clamp(1.75rem, 4vw, 2.5rem); margin: 24px 0 8px; }
  p { color: var(--tinta-suave); }
  ul { list-style: none; padding: 0; margin: 32px 0 0; display: grid; gap: 12px; }
  a.pagina { display: flex; justify-content: space-between; align-items: center; min-height: 64px; padding: 16px 20px; border: 1px solid #333; border-radius: 14px; text-decoration: none; transition: border-color .2s, background .2s; }
  a.pagina:hover { border-color: var(--vermelho); background: #111; }
  a.pagina strong { font-size: 1.125rem; }
  a.pagina span { color: var(--tinta-suave); font-size: .9375rem; }
</style>
</head>
<body>
<main>
  <div class="caixa">
    <img src="comum/logo.png" alt="Bateras Beat Music School" width="96" height="96">
    <h1>Três páginas, um botão: Agendar aula cortesia.</h1>
    <p>Rascunho local para revisão. Cada página fala com um público.</p>
    <ul>
      <li><a class="pagina" href="adulto/"><strong>A · Adulto</strong><span>“eu não tenho coordenação motora”</span></a></li>
      <li><a class="pagina" href="pais/"><strong>B · Pais</strong><span>a porta da cozinha</span></a></li>
      <li><a class="pagina" href="banda/"><strong>C · Banda</strong><span>a cortina e o setlist</span></a></li>
    </ul>
  </div>
</main>
</body>
</html>
